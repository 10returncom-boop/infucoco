<script>
(function(){
  const Q=[
    {q:"此刻的你，最想待在哪裡？",a:[
      {t:"月光下的小草地",type:"star"},
      {t:"一間暖暖的咖啡館",type:"tea"},
      {t:"一本打開的書裡",type:"book"},
      {t:"軟軟的雲朵上",type:"season"}
    ]},
    {q:"心裡悄悄期待什麼？",a:[
      {t:"被好好的擁抱",type:"tea"},
      {t:"一個人安靜一下",type:"book"},
      {t:"來場小小的冒險",type:"star"},
      {t:"重新開始",type:"season"}
    ]},
    {q:"如果今天可以許一個願望？",a:[
      {t:"好好睡一覺",type:"tea"},
      {t:"讀一本好書",type:"book"},
      {t:"看一場星星",type:"star"},
      {t:"去海邊走走",type:"season"}
    ]},
    {q:"你最想念哪一種感覺？",a:[
      {t:"被溫暖包圍",type:"tea"},
      {t:"專注的滿足",type:"book"},
      {t:"浪漫的悸動",type:"star"},
      {t:"新鮮的開始",type:"season"}
    ]},
    {q:"周末你最想怎麼過？",a:[
      {t:"窩在家裡喝咖啡",type:"tea"},
      {t:"去圖書館待半天",type:"book"},
      {t:"上山看夜景",type:"star"},
      {t:"去近郊踏青",type:"season"}
    ]}
  ];
  const R={
    star:{emoji:"🌙",title:"星光療癒",text:"你的心需要浪漫與靜謐。去看一場日落、數一晚星星，或寫一封給未來的信，讓自己沉進溫柔裡。"},
    tea:{emoji:"☕",title:"暖茶療癒",text:"你渴望溫暖和被接住。泡一杯熱飲、裹條毯子，或賴在喜歡的人身邊，讓熱氣把疲憊沖淡。"},
    book:{emoji:"📖",title:"書本療癒",text:"你的心需要安靜與對話。翻一本書、寫一段字，或只是發呆，都是給自己最好的禮物。"},
    season:{emoji:"🌸",title:"四季療癒",text:"你正準備蛻變。去散個步、種一盆花，或整理房間，讓儀式感幫你迎接全新的自己。"}
  };
  const card=document.getElementById("q-card"),bar=document.getElementById("qp-bar");
  let i=0,score={star:0,tea:0,book:0,season:0};
  function start(){i=0;score={star:0,tea:0,book:0,season:0};card.className="quiz-card quiz-fade";render();}
  function render(){
    bar.style.width=(i/Q.length*100)+"%";
    if(i>=Q.length){showResult();return;}
    const q=Q[i];
    card.innerHTML=`<span class="quiz-tag">第 ${i+1} / ${Q.length} 題</span>
      <div class="quiz-q">${q.q}</div>
      ${q.a.map((o,idx)=>`<button class="quiz-opt" data-type="${o.type}">${String.fromCharCode(65+idx)}. ${o.t}</button>`).join("")}`;
    card.querySelectorAll(".quiz-opt").forEach(b=>b.onclick=()=>pick(b));
  }
  function pick(btn){
    btn.classList.add("picked");
    const t=btn.dataset.type;score[t]++;
    setTimeout(()=>{i++;render();},350);
  }
  function showResult(){
    bar.style.width="100%";
    const max=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);
    const r=R[max];
    card.innerHTML=`<div class="quiz-result quiz-fade">
      <div class="emoji">${r.emoji}</div>
      <h3>${r.title}</h3>
      <p>${r.text}</p>
      <button class="btn o" onclick="window.__qstart()">🔁 再測一次</button>
    </div>`;
  }
  window.__qstart=start;
  // 初始畫面
  card.innerHTML=`<div class="quiz-result quiz-fade">
    <div class="emoji">🔮</div>
    <h3>今天你需要哪一種療癒？</h3>
    <p>跟著直覺選一個場景，看看你的心此刻最需要什麼。</p>
    <button class="btn o" onclick="window.__qstart()">開始測驗 →</button>
  </div>`;
})();
</script>
<script>
(function(){
  // reveal on scroll
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.12});
  document.querySelectorAll(".reveal").forEach(function(el){io.observe(el)});
  // scroll top
  var b=document.getElementById("scroll-top");
  if(b){window.addEventListener("scroll",function(){b.classList.toggle("show",window.scrollY>600)});b.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})})}
})();
</script>
