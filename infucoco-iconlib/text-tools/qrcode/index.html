  <div class="tool-box">
    <label for="qr-input">輸入網址或文字</label>
    <input type="text" id="qr-input" placeholder="例如：https://example.com">
    <div class="btn-row">
      <button class="btn" id="qr-gen" type="button">產生 QR Code</button>
      <button class="btn ghost" id="qr-dl" type="button">下載 PNG</button>
    </div>
  </div>

    <div id="qr-box" style="display:inline-block;background:#fff;padding:16px;border:1px solid var(--line);border-radius:12px"></div>

<script src="https://fastly.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script>
(function () {
  var box = document.getElementById("qr-box");
  var hint = document.getElementById("qr-hint");
  var input = document.getElementById("qr-input");
  var qr = null;

  function make() {
    var v = input.value.trim();
    if (!v) { hint.textContent = "請先輸入網址或文字。"; return; }
    if (typeof QRCode === "undefined") {
      hint.textContent = "QR Code 函式庫載入失敗（需連網），請檢查網路後重新整理。";
      return;
    }
    box.innerHTML = "";
    qr = new QRCode(box, { text: v, width: 220, height: 220, colorDark: "#2C2A26", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
    hint.textContent = "已產生。點「下載 PNG」可存圖。";
  }

  document.getElementById("qr-gen").addEventListener("click", make);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") make(); });

  document.getElementById("qr-dl").addEventListener("click", function () {
    var img = box.querySelector("img") || box.querySelector("canvas");
    if (!img) { hint.textContent = "請先產生 QR Code。"; return; }
    var url = img.src;
    var a = document.createElement("a");
    a.href = url;
    a.download = "iconsymbol-qr.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
})();
</script>
