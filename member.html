<script>
(function(){
 var labels={traveler:'旅人 · 免費走走',resident:'居民 · NT$99/月',guardian:'守護者 · NT$299/月',shop:'周邊商品預訂',stickers:'數位商品索取',gallery:'infu世界場景索取',other:'其他詢問'};
 var q=new URLSearchParams(location.search);
 var plan=q.get('plan');
 if(!labels[plan]) plan='other';
 var item=(q.get('item')||'').trim();
 var form=document.getElementById('join');
 var context=document.getElementById('form-context');
 var message=document.getElementById('message');
 function setPlan(p){
 document.querySelectorAll('input[name="intent"]').forEach(function(radio){radio.checked=radio.value===p;});
 context.textContent='目前選擇：'+labels[p]+(item?'｜'+item:'');
 }
 setPlan(plan);
 if(item && !message.value) message.value='我想詢問：'+item;
 document.querySelectorAll('input[name="intent"]').forEach(function(radio){
 radio.addEventListener('change',function(){setPlan(radio.value);});
 });
 form.addEventListener('submit',function(e){
 e.preventDefault();
 if(!form.reportValidity()) return;
 var data=new FormData(form);
 var intent=labels[data.get('intent')]||labels.other;
 var subject='【infucoco 異想世界】'+intent+'｜'+data.get('nickname');
 var body=[
 '方案/需求：'+intent,
 item?'商品/場景：'+item:'',
 '暱稱：'+data.get('nickname'),
 'Email：'+data.get('email'),
 'LINE ID：'+data.get('lineId'),
 '優先聯絡：'+data.get('contactWay'),
 '',
 '留言：',
 data.get('message')||'（無）',
 '',
 '同意聯絡：是'
 ].filter(Boolean).join('\n');
 location.href='mailto:infucoco@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 var success=document.getElementById('form-success');
 success.classList.add('show');
 success.scrollIntoView({behavior:'smooth',block:'center'});
 });
})();
</script>
